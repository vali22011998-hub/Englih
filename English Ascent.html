mis:'“I like the music” untuk musik secara umum (benar: I like music); “a hour” (benar: an hour); “I have dog” (benar: I have a dog).',
p:[['She is ___ engineer. (satu dari banyak profesi)',['an','a','the','some'],'engineer diawali bunyi vokal.'],['I like ___. (musik secara umum)',['music','the music','a music','an music'],'Umum dan tak terhitung: tanpa artikel.'],['___ sun is hot. (hanya satu)',['The','A','An','Some'],'Benda unik memakai the.']],
e:[['He waits for ___ hour.',['an','a','two','many'],'hour diawali bunyi vokal.'],['There is ___ university in my city.',['a','an','two','many'],'university diawali bunyi “yu”.'],['Where is ___ book I gave you? (buku tertentu)',['the','a','an','some'],'Benda tertentu memakai the.'],['I want ___ apple. (satu)',['an','a','two','some'],'apple diawali vokal.'],['Kalimat yang benar',['I have a dog.','I have dog.','I have an dog.','I have the a dog.'],'Benda tunggal memakai a.']]},
'A1.0.3':{k:10,g:'Menyatakan keberadaan dengan there is dan there are.',
core:'<p><b>There is</b> + benda tunggal atau tak terhitung. <b>There are</b> + benda jamak. Negatif: <b>There isn’t / There aren’t</b>. Tanya: <b>Is there…? Are there…?</b> Pakai <b>some</b> (positif) dan <b>any</b> (negatif/tanya).</p>',
ex:'<p>There is a book on the table.<br>There are two cats in the garden.<br>Is there any milk? – Yes, there is.<br>There aren’t any chairs.</p>',
cmp:'There is/are menyatakan keberadaan; It is / They are menyatakan identitas.',
mis:'“There have a book”, “There is two cats”, “Is have any milk?”.',
p:[['There ___ a pen on the desk.',['is','are','have','be'],'Tunggal memakai is.'],['There ___ three students.',['are','is','have','be'],'Jamak memakai are.'],['___ there a bank near here?',['Is','Are','Do','Does'],'Tanya: Is there…?']],
e:[['There ___ some milk in the fridge.',['is','are','have','has'],'milk tak terhitung → is.'],['There aren’t ___ eggs.',['any','a','an','some'],'Negatif memakai any.'],['Negatif: There ___ a park here.',['isn’t','aren’t','don’t have','not'],'There isn’t.'],['Is there a pen? Jawaban singkat',['Yes, there is.','Yes, it is.','Yes, there are.','Yes, I have.'],'Yes, there is.'],['Kalimat yang benar',['There are two books.','There is two books.','There have two books.','There two books are.'],'Jamak memakai are.']]},
'A1.1.0':{k:12,g:'Memakai present simple untuk kebiasaan dan fakta, termasuk negatif dan pertanyaan.',
core:'<p>I/you/we/they + verba dasar; he/she/it + verba<b>+s/es</b>. Negatif: <b>do not / does not</b> + verba dasar. Tanya: <b>Do/Does</b> + subjek + verba dasar? Ejaan: watch → watches, study → studies, go → goes, have → has.</p>',
ex:'<p>I work in a bank. She works in a bank.<br>He doesn’t eat meat.<br>Do you like tea? – Yes, I do.</p>',
cmp:'Setelah does, verba kembali ke bentuk dasar (She doesn’t work, bukan doesn’t works).',
mis:'“She don’t like”, “Does she works?”, “He go to school”.',
p:[['She ___ English every day. (study)',['studies','study','studys','studying'],'study → studies.'],['They ___ TV in the evening. (watch)',['watch','watches','watching','watched'],'They memakai bentuk dasar.'],['He ___ not like coffee.',['does','do','is','are'],'He memakai does.']],
e:[['___ you speak French?',['Do','Does','Are','Is'],'You memakai Do.'],['Does she ___ tea?',['like','likes','liking','liked'],'Setelah does: verba dasar.'],['My brother ___ football on Sundays.',['plays','play','playing','is play'],'He/she/it + -s.'],['Negatif: I ___ eggs for breakfast.',['don’t eat','doesn’t eat','not eat','don’t eats'],'I memakai don’t.'],['Kalimat yang benar',['She doesn’t work here.','She doesn’t works here.','She don’t work here.','She not work here.'],'doesn’t + verba dasar.']]},
'A1.1.1':{k:8,g:'Memakai adverbia frekuensi (always, usually, often, sometimes, rarely, never) dengan posisi yang benar.',
core:T(0,[['always','100%'],['usually','±80%'],['often','±60%'],['sometimes','±40%'],['rarely','±10%'],['never','0%']])+'<p>Posisi: <b>sebelum</b> verba utama (I always get up early) dan <b>sesudah</b> be (She is never late). Tanya frekuensi: <b>How often…?</b> Jawab: every day, twice a week.</p>',
ex:'<p>I always drink coffee.<br>She is never late.<br>How often do you swim? – Twice a week.</p>',
cmp:'never sudah bermakna negatif, jadi tidak dipakai dengan not (bukan “I don’t never”).',
mis:'“I drink always coffee” (posisi salah); “I don’t never eat meat” (negatif ganda).',
p:[['She is ___ late. (tidak pernah)',['never','not never','ever','no'],'never = tidak pernah.'],['Posisi yang benar',['I always drink coffee.','I drink always coffee.','Always I drinks coffee.','I drink coffee always do.'],'Adverbia sebelum verba utama.'],['Arti rarely',['jarang','sering','selalu','tidak pernah'],'rarely = jarang.']],
e:[['Urutan dari paling sering',['always, usually, sometimes, never','never, sometimes, usually, always','sometimes, always, never, usually','usually, never, always, sometimes'],'Dari 100% ke 0%.'],['How often do you swim? Jawaban',['Twice a week.','At six.','In the pool.','Yes, I do.'],'How often menanyakan frekuensi.'],['Posisi dengan be',['She is often tired.','She often are tired.','She is tired often am.','Often is she tired.'],'Setelah be.'],['Arti usually',['biasanya','jarang','selalu','tidak pernah'],'usually = biasanya.'],['Kalimat yang benar',['He never eats meat.','He doesn’t never eat meat.','He never eat meat.','He eats never meat.'],'never + verba (+s).']]},
'A1.1.2':{k:20,g:'Menyebut jam, hari, bulan, dan tanggal dengan preposisi yang tepat.',
core:'<p><b>Jam</b>: It’s three o’clock · half past three (3.30) · quarter past three (3.15) · quarter to four (3.45). <b>Hari</b>: Monday…Sunday. <b>Bulan</b>: January…December. <b>Tanggal</b>: May 5th (May the fifth). <b>Preposisi</b>: at + jam, on + hari/tanggal, in + bulan/tahun.</p>',
ex:'<p>What time is it? – It’s half past seven.<br>My birthday is on March 3rd.<br>See you on Monday at nine.<br>I was born in June.</p>',
cmp:'at (titik waktu), on (hari/tanggal), in (periode lebih panjang: bulan, tahun, musim).',
mis:'“in Monday” (benar: on Monday); “at June” (benar: in June); “half to three”.',
p:[['3:30 dibaca',['half past three','half to three','three past half','half three o’clock'],'30 menit = half past.'],['Hari setelah Tuesday?',['Wednesday','Thursday','Monday','Friday'],'Tuesday → Wednesday.'],['Preposisi: ___ Monday',['on','at','in','by'],'Hari memakai on.']],
e:[['9:15 =',['quarter past nine','quarter to nine','half past nine','nine to fifteen'],'15 menit setelah = quarter past.'],['Bulan pertama dalam setahun',['January','February','December','March'],'January.'],['My birthday is ___ June.',['in','on','at','by'],'Bulan memakai in.'],['Tanggal 5 Mei diucapkan',['May the fifth','May five','Five of May the','May fiveth'],'Tanggal memakai ordinal.'],['7:45 =',['quarter to eight','quarter past eight','half past seven','eight to quarter'],'15 menit sebelum = quarter to.']]},
'A1.1.3':{k:6,g:'Memakai can dan can’t untuk kemampuan, izin, dan permintaan.',
core:'<p><b>can + verba dasar</b>: kemampuan (She can swim), izin (Can I sit here?), permintaan (Can you help me?). Negatif: <b>can’t / cannot</b>. Tanya: <b>Can + subjek + verba</b>? Can tidak berubah untuk he/she/it dan tidak memakai to.</p>',
ex:'<p>She can swim.<br>I can’t speak Japanese.<br>Can you help me?<br>Can I open the window?</p>',
cmp:'can (kemampuan atau izin kini) vs could (lampau/lebih sopan, dipelajari di A2).',
mis:'“She cans swim”, “can to swim”, “Can you to help?”.',
p:[['She ___ swim.',['can','cans','can to','is can'],'can tidak diberi -s.'],['Saya tidak bisa berbahasa Jepang: I ___ speak Japanese.',['can’t','don’t can','can’t to','not can'],'Negatif: can’t.'],['___ you help me? (permintaan)',['Can','Do','Are','Does'],'Can you…?']],
e:[['He can ___ English.',['speak','speaks','to speak','speaking'],'can + verba dasar.'],['Negatif: They ___ come tonight.',['can’t','don’t can','can’t to','aren’t can'],'can’t + verba.'],['Kalimat yang benar',['She can drive.','She can drives.','She cans drive.','She can to drive.'],'can + verba dasar.'],['Can I open the window? artinya',['Bolehkah saya membuka jendela?','Saya bisa menutup jendela','Jendela terbuka','Saya sudah membuka'],'Can I…? = bolehkah saya…?'],['I can cook artinya',['Saya bisa memasak','Saya harus memasak','Saya mau memasak','Saya sedang memasak'],'can = bisa.']]},
'A1.2.0':{k:10,g:'Membuat pertanyaan dengan what, who, where, when, why, how, whose, dan how many/much.',
core:T(0,[['What','apa'],['Who','siapa'],['Where','di mana'],['When','kapan'],['Why','mengapa'],['How','bagaimana'],['Whose','milik siapa'],['How many / How much','berapa banyak (terhitung / tak terhitung)']])+'<p>Pola: <b>kata tanya + do/does/be + subjek</b>: Where do you live? What is your name?</p>',
ex:'<p>Where do you live?<br>How many brothers do you have?<br>How much is this bag?<br>Why are you late?</p>',
cmp:'How many + benda terhitung jamak; How much + benda tak terhitung atau harga.',
mis:'“Where you live?” (hilang do); “How many water?” (benar: How much water?).',
p:[['___ do you live? (tempat)',['Where','When','Who','Why'],'Where = di mana.'],['___ is your teacher? (orang)',['Who','What','Where','When'],'Who = siapa.'],['___ books do you have?',['How many','How much','How old','How long'],'books terhitung.']],
e:[['___ is this bag? (harga)',['How much','How many','How old','How long'],'Harga memakai How much.'],['Where ___ you live?',['do','does','are','is'],'you memakai do.'],['Why is he sad? Jawaban',['Because he lost his phone.','At home.','Tomorrow.','Mr. Lee.'],'Why dijawab dengan because.'],['___ bag is this? (milik siapa)',['Whose','Who’s','What','How'],'Whose = milik siapa.'],['Kalimat yang benar',['Where do you work?','Where you work?','Where does you work?','Where work you?'],'Where + do + subjek + verba.']]},
'A1.2.1':{k:10,g:'Memakai kata sifat dan bentuk komparatif dengan benar.',
core:'<p>Kata sifat ada <b>sebelum</b> kata benda atau <b>setelah</b> be, tidak berubah jamak (two small dogs). Urutan umum: ukuran → warna → benda (a big red car). Komparatif: kata sifat pendek + <b>-er than</b> (taller than), panjang → <b>more … than</b> (more expensive than). Tidak beraturan: good → better, bad → worse.</p>',
ex:'<p>She has a big red car.<br>This box is heavier than that one.<br>English is easier than math.<br>This bag is more expensive than that one.</p>',
cmp:'-er (kata sifat pendek) vs more (kata sifat panjang). Jangan memakai keduanya (bukan “more taller”).',
mis:'“more taller”, “a car red”, “taller that me” (benar: taller than me).',
p:[['This box is ___ than that one. (heavy)',['heavier','more heavy','heavyer','heaviest'],'heavy → heavier.'],['Urutan yang benar',['a big red car','a red big car','big a red car','a car big red'],'Ukuran sebelum warna.'],['Komparatif dari good',['better','gooder','more good','best'],'good → better.']],
e:[['English is ___ than math. (easy)',['easier','more easy','easyer','easiest'],'easy → easier.'],['This bag is ___ expensive than that one.',['more','most','much','very'],'more + kata sifat panjang.'],['Komparatif dari bad',['worse','badder','more bad','worst'],'bad → worse.'],['Kalimat yang benar',['He is taller than me.','He is more tall than me.','He is taller that me.','He is tallest than me.'],'taller than.'],['two ___ dogs (kecil)',['small','smalls','smalled','smalling'],'Kata sifat tidak berubah jamak.']]},
'A1.2.2':{k:12,g:'Memakai preposisi tempat dan waktu dasar dengan tepat.',
core:T(0,[['in','di dalam / di area luas','in the box, in Jakarta'],['on','di atas permukaan','on the table'],['at','di titik tertentu','at home, at school'],['under / behind / next to','di bawah / di belakang / di sebelah',''],['between / in front of','di antara / di depan','']])+'<p>Waktu: <b>at</b> 9 o’clock, <b>on</b> Friday, <b>in</b> July / 2005.</p>',
ex:'<p>The cat is in the box.<br>The book is on the table.<br>The bank is between the school and the post office.<br>I start work at nine.</p>',
cmp:'in (ruang tertutup/area luas), on (permukaan), at (titik/tempat umum seperti at work).',
mis:'“in the table” (benar: on the table); “at Monday” (benar: on Monday).',
p:[['The cat is ___ the box. (di dalam)',['in','on','at','by'],'Di dalam = in.'],['The book is ___ the table.',['on','in','at','of'],'Di atas permukaan = on.'],['I start work ___ 9 o’clock.',['at','on','in','to'],'Jam memakai at.']],
e:[['The bank is ___ the school and the post office.',['between','on','under','at'],'between = di antara dua.'],['The car is ___ of the house. (depan)',['in front','on front','at front','to front'],'in front of.'],['I was born ___ 2005.',['in','on','at','by'],'Tahun memakai in.'],['See you ___ Friday.',['on','in','at','by'],'Hari memakai on.'],['He is ___ work.',['at','in','on','to'],'at work = di tempat kerja.']]},
'A1.2.3':{k:8,g:'Memakai present continuous untuk kejadian yang sedang berlangsung.',
core:'<p><b>be + verba-ing</b>: I am reading. Negatif: <b>am/is/are not</b> + -ing. Tanya: <b>Is she reading?</b> Ejaan: run → running, write → writing, swim → swimming.</p>',
ex:'<p>She is reading a book now.<br>They are playing football.<br>He isn’t sleeping.<br>Is it raining?</p>',
cmp:'Present simple = kebiasaan (She drinks coffee every morning). Present continuous = sedang terjadi (She is drinking coffee now).',
mis:'“She is read”, “He working” (be hilang), “I am know” (verba keadaan tidak dipakai kontinu).',
p:[['She is ___ a book now.',['reading','reads','read','is read'],'be + verba-ing.'],['They ___ playing football now.',['are','is','do','does'],'They memakai are.'],['Eja: run + ing',['running','runing','runming','runeing'],'Konsonan digandakan.']],
e:[['Right now I ___ English.',['am studying','study','studies','studying'],'be + -ing.'],['Negatif: He ___ sleeping.',['isn’t','doesn’t','don’t','aren’t'],'He + isn’t + -ing.'],['___ it raining?',['Is','Are','Do','Does'],'it memakai Is.'],['Kebiasaan: She ___ coffee every morning.',['drinks','is drinking','drinking','drank'],'Kebiasaan = present simple.'],['write + ing',['writing','writeing','writting','writeng'],'Huruf e dibuang.']]},
'A1.3.0':{k:16,g:'Membentuk jamak dan memakai this, that, these, those.',
core:T(0,[['Aturan','Contoh'],['+ s','book → books'],['+ es (s, x, ch, sh)','bus → buses, box → boxes'],['konsonan + y → ies','city → cities'],['tidak beraturan','child → children, man → men, foot → feet']])+'<p><b>this/these</b> = dekat (satu/banyak), <b>that/those</b> = jauh.</p>',
ex:'<p>This is my book. These are my books.<br>That is a bus. Those are buses.</p>',
cmp:'this (tunggal dekat) vs these (jamak dekat); that vs those untuk benda jauh.',
mis:'“two childs” (benar: two children); “this books” (benar: these books).',
p:[['Jamak dari city',['cities','citys','cityes','citis'],'y → ies.'],['___ are my shoes. (dekat, jamak)',['These','This','That','Those'],'Dekat jamak = these.'],['Jamak dari child',['children','childs','childes','childrens'],'Tidak beraturan.']],
e:[['Jamak dari box',['boxes','boxs','boxies','boxen'],'x → es.'],['___ is a cat. (jauh, tunggal)',['That','This','These','Those'],'Jauh tunggal = that.'],['Jamak dari man',['men','mans','manes','mens'],'Tidak beraturan.'],['___ books are on the shelf. (jauh)',['Those','That','This','It'],'Jauh jamak = those.'],['Kalimat yang benar',['These are my keys.','This are my keys.','These is my keys.','That are my keys.'],'These + are.']]},
'A1.3.1':{k:20,g:'Menyebut angka 21–1000 dan menanyakan atau menyebut harga.',
core:T(0,[['21 twenty-one','30 thirty','40 forty','50 fifty'],['60 sixty','70 seventy','80 eighty','90 ninety'],['100 one hundred','101 one hundred and one','1,000 one thousand','']])+'<p>Harga: <b>How much is it?</b> – It’s ten dollars. / <b>How much are they?</b> – They’re five dollars. Mata uang: dollar, euro, pound, rupiah.</p>',
ex:'<p>How much is this bag? – It’s twenty-five dollars.<br>How much are these shoes? – They’re ninety dollars.</p>',
cmp:'thirteen (13) vs thirty (30): tekanan kata berbeda. Gunakan is untuk satu benda dan are untuk jamak.',

p:[['Angka 40',['forty','fourty','fortty','fotry'],'40 = forty.'],['Angka 90',['ninety','nineteen','ninty','nighty'],'90 = ninety.'],['Angka 101',['one hundred and one','one hundred one and','hundred one','one and hundred one'],'101 = one hundred and one.']],
e:[['How much ___ these shoes?',['are','is','do','does'],'Jamak memakai are.'],['Angka 15 vs 50: 50 =',['fifty','fifteen','fivety','fiften'],'50 = fifty.'],['Angka 1,000',['one thousand','one hundred','ten hundred','one million'],'1,000 = one thousand.'],['“It’s twenty dollars.” menjawab',['How much is it?','How many is it?','Where is it?','What is it called?'],'Menanyakan harga.'],['Angka 70',['seventy','seventeen','sevnty','seventen'],'70 = seventy.']]},
'A1.3.2':{k:8,g:'Memberi perintah, melarang, dan meminta dengan sopan.',
core:'<p><b>Imperatif</b> memakai verba dasar: Open the door. Negatif: <b>Don’t</b> + verba (Don’t run). Sopan: tambahkan <b>please</b>, atau <b>Can/Could you…?</b>, <b>Can I have…?</b> Ajakan: <b>Let’s</b> + verba (Let’s go).</p>',
ex:'<p>Please sit down.<br>Don’t touch that!<br>Could you open the window, please?<br>Let’s have lunch.</p>',
cmp:'Could you…? lebih sopan daripada Can you…?; Let’s mengajak bersama; Don’t melarang.',
mis:'“Not run” (benar: Don’t run); “You open the door” untuk perintah; lupa please pada permintaan.',
p:[['Larangan: ___ run in class.',['Don’t','Not','No','Doesn’t'],'Don’t + verba.'],['Ajakan: ___ go home.',['Let’s','Let','Lets','We’s'],'Let’s = mari.'],['Permintaan sopan',['Could you open the window, please?','You open the window.','Open window you.','Opening the window.'],'Could you…, please?']],
e:[['Perintah: ___ your book.',['Open','Opens','Opening','To open'],'Imperatif = verba dasar.'],['Negatif: ___ touch that!',['Don’t','Not','Doesn’t','No'],'Don’t + verba.'],['Paling sopan',['Could you help me, please?','Help me.','You help me.','Helping me!'],'Could you…, please?'],['Let’s ___ lunch.',['have','having','to have','has'],'Let’s + verba dasar.'],['Arti “Let’s go.”',['Mari pergi.','Jangan pergi.','Dia pergi.','Saya pergi.'],'Let’s = mari.']]}
});

Object.assign(CT,{
'A1.4.0':{k:6,g:'Menyatakan kepemilikan dengan have got dan has got.',
core:'<p><b>have got / has got</b> = punya (informal). I/you/we/they <b>have got</b>; he/she/it <b>has got</b>. Negatif: <b>haven’t / hasn’t got</b>. Tanya: <b>Have you got…? Has she got…?</b> Jawab: Yes, I have. / No, she hasn’t.</p>',
ex:'<p>I’ve got two brothers.<br>She’s got a new phone.<br>Have you got a pen? – Yes, I have.<br>He hasn’t got a car.</p>',
cmp:'have got (informal, gaya Britania) sepadan dengan have (Do you have…?). Jangan campur: bukan “Do you have got”.',
mis:'“She have got”, “Do you have got a pen?”, “I haven’t got a pens”.',
p:[['She ___ got a bike.',['has','have','is','does'],'She memakai has got.'],['___ you got a pen?',['Have','Do','Are','Has'],'Have you got…?'],['Negatif: He ___ got a car.',['hasn’t','doesn’t','isn’t','haven’t'],'He hasn’t got.']],
e:[['I ___ got two brothers.',['have','has','am','do'],'I have got.'],['Has she got a dog? – No, she ___.',['hasn’t','doesn’t','isn’t','haven’t'],'No, she hasn’t.'],['They ___ got a big house.',['have','has','is','does'],'They have got.'],['Kalimat yang benar',['She has got a cat.','She have got a cat.','She has get a cat.','She is got a cat.'],'She has got.'],['I’ve got =',['I have got','I am got','I has got','I did got'],'I’ve = I have.']]},
'A1.4.1':{k:6,g:'Memakai some, any, a lot of, much, dan many dengan benar.',
core:'<p><b>some</b>: kalimat positif dan tawaran (Would you like some tea?). <b>any</b>: negatif dan tanya (I don’t have any money. Is there any milk?). <b>a lot of</b>: banyak (positif). <b>many</b> + benda terhitung, <b>much</b> + benda tak terhitung (dalam negatif dan tanya): How many books? How much water?</p>',
ex:'<p>I have some apples.<br>I don’t have any money.<br>She has a lot of friends.<br>How much water do you drink?</p>',
cmp:'some (positif) vs any (negatif/tanya). many (terhitung) vs much (tak terhitung).',
mis:'“I don’t have some money”, “How much books?”, “I have much friends”.',
p:[['I have ___ apples. (positif)',['some','any','much','a'],'Positif jamak: some.'],['I don’t have ___ money.',['any','some','many','a'],'Negatif: any.'],['How ___ books do you have?',['many','much','some','any'],'books terhitung → many.']],
e:[['Penawaran: Would you like ___ tea?',['some','any','many','a'],'Tawaran memakai some.'],['There isn’t ___ water.',['much','many','some','a'],'water tak terhitung.'],['She has ___ friends. (banyak)',['a lot of','much','any','a'],'Positif: a lot of.'],['How ___ water do you drink?',['much','many','some','any'],'water tak terhitung.'],['Kalimat yang benar',['I have a lot of friends.','I have a lot friends.','I have much friends.','I have lot of friends.'],'a lot of + benda.']]},
'A1.4.2':{k:6,g:'Menyatakan kesukaan dan keinginan dengan like, want, dan would like.',
core:'<p><b>like</b> + benda atau verba-ing: I like tea. I like swimming. <b>want</b> + benda atau to + verba: I want a coffee. I want to go home. <b>would like</b> (lebih sopan): I’d like a coffee. Would you like some tea? Setelah would like/want: <b>to + verba dasar</b>.</p>',
ex:'<p>I like swimming.<br>I want to learn English.<br>I’d like a table for two, please.<br>Would you like some tea?</p>',
cmp:'want = langsung; would like = sopan (di restoran, toko, tamu).',

'A1.4.3':{k:6,g:'Menyatakan kepemilikan dengan ’s dan bertanya dengan whose.',
core:'<p><b>Pemilik + ’s + benda</b>: Anna’s book. Jamak berakhiran s: <b>the students’ books</b>. <b>Whose</b> + benda: Whose bag is this? – It’s Tom’s. Untuk benda mati dipakai <b>of</b>: the door of the room. ’s juga bisa berarti <b>is</b> (Tom’s here = Tom is here).</p>',

cmp:'’s milik (Anna’s book) vs ’s = is (Anna’s happy). Whose bertanya pemilik; Who’s = Who is.',
mis:'“Annas phone”, “the door’s room”, “Who’s bag is this?”.',
p:[['Buku milik Anna: ___ book',['Anna’s','Annas','Annas’','of Anna'],'Pemilik + ’s.'],['___ bag is this? – It’s Tom’s.',['Whose','Who','Who’s','What'],'Whose = milik siapa.'],['Buku milik para siswa: the ___ books',['students’','student’s','students','studentes'],'Jamak: students’.']],
e:[['Tom’s here. ’s berarti',['is','milik','has','are'],'Tom’s here = Tom is here.'],['Kalimat yang benar',['This is Anna’s phone.','This is Annas phone.','This is phone Anna’s.','This is Anna phone.'],'Pemilik + ’s + benda.'],['Pintu ruangan: the door ___ the room',['of','’s','at','for'],'Benda mati memakai of.'],['Whose pen is this? artinya',['Pena milik siapa ini?','Siapa nama pena ini?','Di mana pena ini?','Kapan pena ini?'],'Whose = milik siapa.'],['My brother’s name is Ben. ’s berarti',['milik','is','has','was'],'Kepemilikan.']]},
'A1.4.4':{k:5,g:'Menghubungkan kalimat dengan and, but, or, because, dan so.',
core:'<p><b>and</b> = tambahan, <b>but</b> = pertentangan, <b>or</b> = pilihan, <b>because</b> = sebab, <b>so</b> = akibat. Koma sebelum but dan so: I was tired, so I slept. <b>because</b> menerangkan sebab: I stayed home because it rained.</p>',
ex:'<p>I have a cat and a dog.<br>I like tea, but I don’t like coffee.<br>Do you want tea or coffee?<br>It rained, so I stayed home.</p>',
cmp:'because (sebab) dan so (akibat) tidak dipakai bersamaan dalam satu kalimat.',
mis:'“Because it rained, so I stayed” (pilih salah satu); “I like tea but also coffee”.',
p:[['I like tea ___ I don’t like coffee.',['but','and','or','so'],'but = pertentangan.'],['Do you want tea ___ coffee?',['or','and','but','because'],'or = pilihan.'],['I stayed home ___ it rained.',['because','so','but','or'],'because = sebab.']],
e:[['It rained, ___ I stayed home.',['so','because','or','but'],'so = akibat.'],['I have a cat ___ a dog.',['and','but','or','so'],'and = tambahan.'],['Kalimat yang benar',['I stayed home because it rained.','Because it rained, so I stayed home.','I stayed home so because it rained.','I stayed home because so it rained.'],'because + sebab.'],['“but” menyatakan',['pertentangan','tambahan','pilihan','sebab'],'but = tetapi.'],['“so” menyatakan',['akibat','sebab','pilihan','pertentangan'],'so = jadi.']]},

e:[['“opposite” artinya',['di seberang','di sebelah','di belakang','di bawah'],'opposite = di seberang.'],['“next to” artinya',['di sebelah','di seberang','di depan','di atas'],'next to = di sebelah.'],['Memberi arah ke kanan',['Turn right at the corner.','Turn to right in corner.','Right turn at corner.','Go to turning right.'],'Turn right.'],['“It’s far” artinya',['Jaraknya jauh.','Dekat.','Tutup.','Mahal.'],'far = jauh.'],['Bertanya apakah ada bank di dekat sini',['Is there a bank near here?','Is bank near here?','There is bank here?','Are there bank near?'],'Is there a…?']]},

'A1.5.3':{k:12,g:'Menceritakan rutinitas harian secara berurutan.',
core:'<p><b>Urutan rutinitas</b>: wake up → get up → take a shower → have breakfast → go to school/work → have lunch → come home → have dinner → watch TV → go to bed. <b>Penghubung</b>: first, then, after that, finally. Waktu: <b>at</b> + jam (at six).</p>',

return hs.map(h=>`<div class=sy style="margin:10px 0;border-color:#fbbf24;box-shadow:0 0 18px #fbbf2466"><div class=sh style="color:#fbbf24">[ GERBANG TERSEMBUNYI TERBUKA ]</div><b>${h.n}</b><p class=mu>Musuh ini sedikit di atas kemampuanmu. Syaratnya dirahasiakan.</p><button class=p data-i=${h.id} onclick="hboss(this.dataset.i)">Masuki</button></div>`).join('')+`<div class=sy style="margin:10px 0"><div class=sh>[ BOSS MINGGUAN ]</div><span style="position:absolute;right:14px;top:8px;font-size:56px;opacity:.3;filter:grayscale(.6) drop-shadow(0 0 10px #3b82f6)">${['👺','👹','🐉','😈','👑','☠️'][S.rank]}</span><b>${b}</b><p class=mu>${w?'✓ Sudah dikalahkan minggu ini':sun?'Hadir hari ini! Hadiah +150 XP di luar batas harian':'Muncul setiap hari Minggu'}</p>${sun&&!w?'<button class=p onclick="wboss()">Lawan Boss</button>':''}</div>`}
function bossQ(lv,n){const u={},l=[];for(let i=0;i<80&&l.length<n;i++){const q=gen('mix',lv);if(!u[q.id]){u[q.id]=1;Q[q.id]=q;l.push(q)}}return l}
function wboss(){const b=BN[S.rank],l=bossQ(LV[S.rank],11),w=Object.keys(S.err).filter(k=>Q[k]).slice(0,4).map(k=>Q[k]);
quiz(sh([...l,...w]).slice(0,15),'eval','⚔ '+b,r=>{if(r.pct>=80){S.wb=wk();r.xp+=bonus(150);ttl('Pemburu '+b)}save();fin(r,'',`<button class=p onclick="go('home')">Beranda</button>`)})}
function hboss(id){const h=HB.find(x=>x.id==id);quiz(bossQ('all',15),'eval','⚔ '+h.n,r=>{if(r.pct>=80){(S.hb=S.hb||{})[id]=1;ttl(h.t);r.xp+=bonus(300)}save();fin(r,'',`<button class=p onclick="go('home')">Beranda</button>`)})}
const mq=()=>{const a=ALL.filter(s=>s.c&&RANKOF[s.li]==S.rank);return{a,tot:a.length,done:a.filter(s=>done(s.id)).length}};
const SQ=[['q','Jawab benar 15 soal',15,20],['c','Ingat 10 kartu hafalan',10,15],['l','Selesaikan 1 latihan acak',1,15],['w','Eja 5 kata (spelling)',5,15]];
function sq(k,n=1){const t=new Date().toLocaleDateString('sv');if(S.day.d!=t)S.day={d:t,xp:0,cnt:{}};const s=S.day.sq=S.day.sq||{};s[k]=(s[k]||0)+n;
SQ.forEach(x=>{if(x[0]==k&&s[k]>=x[2]&&!s['x'+k]){s['x'+k]=1;const g=award('s',x[3],0,1,'sq'+k,1);toast(`<div class=sh>[ SIDE QUEST ]</div>${x[1]}<br><b>Selesai! +${g} XP</b>`)}});save()}
function qp(){const t=new Date().toLocaleDateString('sv'),s=S.day.d==t?S.day.sq||{}:{},m=mq(),nx=m.a.filter(x=>!done(x.id));
return`<div class=sy style="margin:10px 0"><div class=sh>[ MAIN QUEST ]</div><div class=row><span>Tuntaskan semua sesi rank ${RK()[0]}</span><b>${m.done}/${m.tot}</b></div><div class=bar><i style="width:${m.tot?m.done/m.tot*100:0}%"></i></div>${nx.slice(0,3).map(x=>`<div class=mu style="margin-top:6px">${locked(x)?'🔒':'▸'} ${x.title}${locked(x)?' · Lv.'+reqLv(x):''}</div>`).join('')}</p>${warn()}</div><div class=sy style="margin:10px 0"><div class=sh>[ SIDE QUEST · HARIAN ]</div>${SQ.map(x=>`<div class=row style="margin-top:6px"><span>${s['x'+x[0]]?'✓':'○'} ${x[1]}</span><span class=mu>${Math.min(s[x[0]]||0,x[2])}/${x[2]} · +${x[3]} XP</span></div>`).join('')}</div>`}
const LI={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6},cm=p=>Object.keys(S.cd||{}).filter(k=>k[0]==p&&S.cd[k].b>=4).length;
function deck(){const a=[];VOC.forEach(x=>S.rank>=RANKOF[LI[x[3]]]&&a.push({k:'V:'+x[0],f:x[0],r:x[1],m:x[2],t:'v'}));KAN.forEach(x=>S.rank>=RANKOF[LI[x[4]]]&&a.push({k:'K:'+x[0],f:x[0],r:x[2],m:x[3],t:'k'}));return a}
function cardBox(){const d=deck(),cd=S.cd||{},t=new Date().toLocaleDateString('sv'),du=d.filter(c=>cd[c.k]&&cd[c.k].due<=Date.now()).length,nw=Math.min(d.filter(c=>!cd[c.k]).length,Math.max(0,10-(S.day.d==t?S.day.nc||0:0)));return`<div class=c><b>Kartu hafalan</b><p class=mu>${du} kartu jatuh tempo · ${nw} kartu baru hari ini</p><button class=p ${du+nw?'':'disabled'} onclick="cards()">Mulai kartu</button></div>`}
function cards(){S.cd=S.cd||{};const d=deck(),now=Date.now(),t0=new Date().toLocaleDateString('sv');if(S.day.d!=t0)S.day={d:t0,xp:0,cnt:{}};
const du=d.filter(c=>S.cd[c.k]&&S.cd[c.k].due<=now),nw=d.filter(c=>!S.cd[c.k]).slice(0,Math.max(0,10-(S.day.nc||0)));S.day.nc=(S.day.nc||0)+nw.length;save();
const q=[...sh(du),...nw],n=q.length;let gx=0;
(function nx(){if(!q.length){M.innerHTML=`<div class=c><h1>Kartu selesai</h1><p>${n} kartu · <b>+${gx} XP</b></p><button class=p onclick="go('rev')">Kembali</button></div>`;return}
const c=q[0];M.innerHTML=`<p class=mu>Sisa ${q.length} kartu · ${c.t=='v'?'Kosakata':'Frasa'}</p><div class=c style="text-align:center"><div class=jp style="font-size:30px">${c.f}</div><button onclick="say(this.dataset.t)" data-t="${c.f}">🔊</button><div id=bk2></div><button class=p id=sh2>Tampilkan jawaban</button></div>`;
$('#sh2').onclick=()=>{$('#bk2').innerHTML=`<p>${c.r}<br><b>${c.m}</b></p>`;$('#sh2').outerHTML='<button id=lp>Lupa</button> <button class=p id=ig>Ingat</button>';
$('#lp').onclick=()=>{S.cd[c.k]={b:0,due:Date.now()+6e5};save();q.shift();q.push(c);nx()};
$('#ig').onclick=()=>{const e=S.cd[c.k]||{b:0},b=e.b+1;S.cd[c.k]={b,due:Date.now()+[1,2,4,8,16,32,60][Math.min(b,7)-1]*864e5};gx+=award(c.t,c.t=='k'?4:2,.03,.3,'c:'+c.t,1);sq('c');q.shift();nx()}}})()}
function quiz(list,mode,title,cb){const xb=/^(⚔|💀)/.test(title);let i=0,ok=0,bad=[],gx=0;
function show(){const q=list[i],os=sh(q.o.map((t,j)=>[t,j]));
M.innerHTML=`<p class=mu>${title} · ${i+1}/${list.length}</p><div class=bar><i style="width:${i/list.length*100}%"></i></div><div class=c><h2 class=jp>${q.q}</h2>${os.map((o,k)=>`<button class=o data-j="${o[1]}" onclick="A(${k})">${o[0]}</button>`).join('')}<div id=fb></div></div>`;window.A=k=>{const b=[...document.querySelectorAll('.o')],j=+b[k].dataset.j,right=j==0;
sfx(right?'ok':'bad');let g=0;const ct=q.id[0]=='g'?({a:'r',p:'g',w:'v',y:'k'}[q.id[2]]||q.id[2]):'s',ca=(S.ac=S.ac||{})[ct]=(S.ac||{})[ct]||[0,0];ca[1]++;if(right)ca[0]++;if(right){ok++;const bs={v:2,r:3,k:4,g:6,s:mode=='eval'?6:4}[ct];g=award(ct,bs,.03,.3,'q:'+ct,1,xb);gx+=g;sq('q')}else bad.push(q);
const e=S.err[q.id];if(mode=='rev'){if(right){delete S.err[q.id]}else{e.ok=0;e.b=0;e.due=Date.now()}}else if(!right)S.err[q.id]={b:0,due:Date.now(),t:Date.now(),q:q.g?q:undefined};else delete S.err[q.id];save();
const next=()=>{i++;i<list.length?show():cb({ok,n:list.length,pct:Math.round(ok/list.length*100),bad,xp:gx})};
if(mode=='eval')return next();
b.forEach(x=>{x.disabled=true;if(x.dataset.j==0)x.classList.add('ok');});if(!right)b[k].classList.add('no');
$('#fb').innerHTML=`<p>${right?'✓ Benar. ':'✗ Kurang tepat. '}${q.e}${g?` <b>+${g} XP</b>`:''}</p><button class=p id=nx>${i+1<list.length?'Lanjut →':'Selesai'}</button>`;$('#nx').onclick=next}}
show()}
document.documentElement.classList.toggle('nf',!!S.nf);
go('home');
</script></body></html>
